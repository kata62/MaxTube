name: Generate TrollFools/Cyan files

on:
  workflow_dispatch:
    inputs:
      create_cyan:
        description: "Generate .cyan file"
        type: boolean
        required: true
        default: true

      create_tf:
        description: "Generate .zip for TrollFools"
        type: boolean
        required: true
        default: true

      enable_youpip:
        description: "Integrate YouPiP"
        type: boolean
        required: true
        default: true

      enable_ytuhd:
        description: "Integrate YTUHD"
        type: boolean
        required: true
        default: true

      enable_yq:
        description: "Integrate YouQuality"
        type: boolean
        required: true
        default: true

      enable_ryd:
        description: "Integrate Return YouTube Dislikes"
        type: boolean
        required: true
        default: true

      enable_ytabc:
        description: "Integrate YTABConfig"
        type: boolean
        required: true
        default: true

      enable_demc:
        description: "Integrate DontEatMyContent"
        type: boolean
        required: true
        default: true

      enable_ytweaks:
        description: "Integrate YTWeaks"
        type: boolean
        required: true
        default: true

      enable_gonerino:
        description: "Integrate Gonerino"
        type: boolean
        required: true
        default: true

      enable_youspeed:
        description: "Integrate YouSpeed"
        type: boolean
        required: true
        default: true

      enable_YTLCM:
        description: "Integrate YTLCM"
        type: boolean
        required: true
        default: true

      enable_VolumeBoostYT:
        description: "Integrate VolumeBoostYT"
        type: boolean
        required: true
        default: true

      enable_YouGetCaption:
        description: "Integrate YouGetCaption"
        type: boolean
        required: true
        default: true

      enable_ytpf:
        description: "Integrate YTPF"
        type: boolean
        required: true
        default: true

      enable_ytpfBETA:
        description: "Integrate YTPFBeta"
        type: boolean
        required: true
        default: true

      enable_ycq:
        description: "Integrate YouCopyURL / YCQ"
        type: boolean
        required: true
        default: true

      enable_ys:
        description: "Integrate YouShorts"
        type: boolean
        required: true
        default: true

      enable_youloop:
        description: "Integrate YouLoop"
        type: boolean
        required: true
        default: true

      enable_youmute:
        description: "Integrate YouMute"
        type: boolean
        required: true
        default: true

      tweak_version:
        description: "The version of the tweak to use. Enter the version manually from dayanch96/YTLite/releases or leave default"
        default: "5.2b4"
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_yq: ${{ inputs.enable_yq }}
      enable_ryd: ${{ inputs.enable_ryd }}
      enable_ytabc: ${{ inputs.enable_ytabc }}
      enable_demc: ${{ inputs.enable_demc }}
      enable_ytweaks: ${{ inputs.enable_ytweaks }}
      enable_gonerino: ${{ inputs.enable_gonerino }}
      enable_youspeed: ${{ inputs.enable_youspeed }}
      enable_YTLCM: ${{ inputs.enable_YTLCM }}
      enable_VolumeBoostYT: ${{ inputs.enable_VolumeBoostYT }}
      enable_YouGetCaption: ${{ inputs.enable_YouGetCaption }}
      enable_ytpf: ${{ inputs.enable_ytpf }}
      enable_ytpfBETA: ${{ inputs.enable_ytpfBETA }}
      enable_ycq: ${{ inputs.enable_ycq }}
      enable_ys: ${{ inputs.enable_ys }}
      enable_youloop: ${{ inputs.enable_youloop }}
      enable_youmute: ${{ inputs.enable_youmute }}
      tweak_version: ${{ inputs.tweak_version }}

  package:
    name: Generate Cyan/TrollFools
    runs-on: macos-latest
    needs: build-tweaks
    permissions:
      contents: write

    steps:
      - name: Download built debs
        uses: actions/download-artifact@v4
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Check Inputs
        if: ${{ !inputs.create_cyan && !inputs.create_tf }}
        run: |
          echo "No output format selected."
          exit 0

      - name: Install Dependencies
        run: brew install dpkg

      - name: Install cyan
        if: ${{ github.event.inputs.create_cyan == 'true' }}
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Generate .cyan file
        if: ${{ github.event.inputs.create_cyan == 'true' }}
        run: |
          tweaks="ytplus.deb OpenYoutubeSafariExtension.appex"
          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks$f"
          done
          cgen -uwef $tweaks -n "${{ github.event.inputs.display_name }}" -b ${{ github.event.inputs.bundle_id }} -o cyan_YouTubePlus_${{ github.event
